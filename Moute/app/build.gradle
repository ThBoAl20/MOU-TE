// Módulo que genera el APK de Moute. El plugin de Google lee app/google-services.json.
// Ese archivo es configuración cliente local, no una credencial del Admin SDK.
apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    // SDK y Build Tools fijados por el proyecto académico original.
    compileSdkVersion 29
    buildToolsVersion "29.0.2"

    defaultConfig {
        // Este identificador debe coincidir con la app Android registrada en Firebase.
        applicationId "com.manuel.moute"
        minSdkVersion 16
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            // La versión actual no activa reducción/obfuscación de código.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.navigation:navigation-fragment:2.2.2'
    implementation 'androidx.navigation:navigation-ui:2.2.2'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    // Servicios remotos: perfil/tarjetas en Database, sesión en Auth e imágenes en Storage.
    implementation 'com.google.firebase:firebase-storage:16.0.4'
    implementation 'com.google.firebase:firebase-database:16.0.4'
    implementation 'com.google.firebase:firebase-auth:16.0.5'
    //Librerias Google Maps
    implementation 'com.google.android.libraries.places:places:2.2.0'
    implementation 'com.google.android.gms:play-services-location:17.0.0'
    implementation 'com.google.maps.android:android-maps-utils:1.0.2'
    // SDK legado para la muestra de pago sandbox. No acredita pagos reales de servidor.
    implementation 'com.paypal.sdk:paypal-android-sdk:2.15.3'

    implementation 'com.flaviofaria:kenburnsview:1.0.7'
    implementation 'com.google.firebase:firebase-messaging:17.3.4'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    implementation 'androidx.mediarouter:mediarouter:1.1.0'
    implementation 'com.google.android.material:material:1.1.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.hbb20:ccp:2.5.0'
    // Control visual para un código; no implementa por sí solo la verificación telefónica.
    implementation 'io.github.chaosleung:pinview:1.4.4'
    // Versión explícita para resolver la dependencia transitiva antigua de Places.
    implementation 'com.android.volley:volley:1.2.0'
    // Libreria Google Maps
    implementation 'com.google.android.gms:play-services-maps:17.0.0'

    // Carga de imágenes de perfil por URL en la interfaz.
    implementation 'com.squareup.picasso:picasso:2.5.2'


}
